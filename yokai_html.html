<!DOCTYPE html>

<head>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #1a0020 0%, #000 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Hiragino Kaku Gothic Pro', 'メイリオ', sans-serif;
    padding: 2rem 1rem;
  }
  h1 {
    color: #fff;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    margin-bottom: 0.3rem;
    text-align: center;
  }
  .subtitle {
    color: #aaa;
    font-size: 0.8rem;
    margin-bottom: 2rem;
    letter-spacing: 0.1em;
  }
  .card {
    width: 300px;
    min-height: 320px;
    border-radius: 20px;
    background: #ffffff11;
    border: 2px solid #ffffff22;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    margin-bottom: 2rem;
    transition: background 0.4s, border-color 0.4s;
  }
  .card.show {
    animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  .card-img {
    width: 180px;
    height: 200px;
    object-fit: contain;
    border-radius: 10px;
    margin-bottom: 1rem;
  }
  .card-emoji {
    font-size: 5rem;
    margin-bottom: 1rem;
    line-height: 1;
  }
  .card-name {
    color: #fff;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    margin-bottom: 0.5rem;
  }
  .card-desc {
    color: #ccc;
    font-size: 0.9rem;
    text-align: center;
    line-height: 1.7;
  }
  .card-empty {
    color: #555;
    font-size: 1rem;
    text-align: center;
    line-height: 2;
  }
  button {
    padding: 1rem 3rem;
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    background: transparent;
    color: #fff;
    border: 2px solid #ffffff55;
    border-radius: 50px;
    cursor: pointer;
    transition: background 0.2s;
    font-family: inherit;
  }
  button:hover { background: #ffffff18; }
  button:active { transform: scale(0.96); }
  .prev {
    color: #555;
    font-size: 0.75rem;
    margin-top: 1.5rem;
    letter-spacing: 0.1em;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.7) rotate(-4deg); }
    to   { opacity: 1; transform: scale(1) rotate(0deg); }
  }
</style>
</head>
<body>

<p class="subtitle">ボタンをおして よびだそう</p>

<div class="card" id="card">

window.addEventListener('load', () => {
  yokai.forEach(y => {
    if (y.img) {
      const img = new Image();
      img.src = y.img;
    }
  });
});

let current = null;

function draw() {
  const pool = yokai.filter(y => y !== current);
  const pick = pool[Math.floor(Math.random() * pool.length)];
  if (current) document.getElementById('prev').textContent = 'まえ：' + current.name;
  current = pick;
  render(pick);
}

function render(y) {
  const card = document.getElementById('card');
  card.style.background = y.color + '22';
  card.style.borderColor = y.color + '88';
  card.className = 'card';
  void card.offsetWidth;
  card.className = 'card show';

  if (y.img) {
    card.innerHTML = `
      <img class="card-img" src="${y.img}" alt="${y.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <div class="card-emoji" style="display:none">${y.emoji}</div>
      <div class="card-name">${y.name}</div>
      <div class="card-desc">${y.desc}</div>
    `;
  } else {
    card.innerHTML = `
      <div class="card-emoji">${y.emoji}</div>
      <div class="card-name">${y.name}</div>
      <div class="card-desc">${y.desc}</div>
    `;
  }
}
